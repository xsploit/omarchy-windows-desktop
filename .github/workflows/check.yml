name: Installer checks
on: [push, pull_request]
jobs:
  staged-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/test_install.py
      - run: python3 -m py_compile install.py restore.py
      - run: bash -n install-apps.sh
